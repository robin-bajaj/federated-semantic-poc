
# ============================================================
# Federated Semantic POC - dbt Project Configuration
# ============================================================

name: 'my_new_project'
version: '1.0.0'
config-version: 2

# ------------------------------------------------------------
# Database connection profile
# ------------------------------------------------------------

profile: 'default'

# ------------------------------------------------------------
# Project directories
# ------------------------------------------------------------

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

# ------------------------------------------------------------
# Model configurations
# ------------------------------------------------------------

models:
  my_new_project:
    +materialized: view

# ------------------------------------------------------------
# CDO Enterprise Position Contract
# Custom project variables consumed by our dbt macros.
# Not a native MetricFlow semantic model.
# ------------------------------------------------------------

vars:

  cdo_minimum_position_contract:
    name: enterprise_position
    version: "1.0"
    owner: enterprise_cdo

    required_attributes:
      position_id: text
      report_date: date
      profit_loss: numeric
      instrument_id: integer

    implementations:
      - team: lob_team_a
        model: stg_team_a_positions
        version: "1.0"
        mappings:
          position_id: posId
          report_date: report_date
          profit_loss: profit_loss
          instrument_id: instrument_code

      - team: lob_team_c
        model: stg_team_c_positions
        version: "1.0"
        mappings:
          position_id: posIdentity
          report_date: report_date
          profit_loss: profit_loss
          instrument_id: instrument_code
