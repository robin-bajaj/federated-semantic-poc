
# ============================================================
# Federated Semantic POC - dbt Project Configuration
# ============================================================

name: 'my_new_project'
version: '1.0.0'
config-version: 2

# ------------------------------------------------------------
# Database connection profile
# ------------------------------------------------------------

profile: 'default'

# ------------------------------------------------------------
# Project directories
# ------------------------------------------------------------

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

# ------------------------------------------------------------
# Model configurations
# ------------------------------------------------------------

models:
  my_new_project:
    +materialized: view

# ------------------------------------------------------------
# CDO Enterprise Position Contract
# Custom project variables consumed by our dbt macros.
# Not a native MetricFlow semantic model.
# ------------------------------------------------------------

vars:
  cdo_position:

    name: enterprise_position

    description: >
      Common enterprise Position definition governed by CDO.
      Team A and Team C provide their own implementations
      through standardized staging models.

    # --------------------------------------------------------
    # Common CDO attributes
    # --------------------------------------------------------

    attributes:
      position_id: text
      report_date: date
      profit: numeric
      instrument_code: integer

    # --------------------------------------------------------
    # Team-specific physical mappings
    # --------------------------------------------------------

    teams:

      # Team A - Equity Positions
      - name: team_a

        source_model: team_a_positions
        staging_model: stg_team_a_positions

        source_columns:
          position_id: posID
          report_date: rptDate
          profit: pnl
          instrument_code: instrumentID

      # Team C - Fixed Income Positions
      - name: team_c

        source_model: team_c_positions
        staging_model: stg_team_c_positions

        source_columns:
          position_id: posIdentity
          report_date: rptDate
          profit: profitloss
          instrument_code: insCode
