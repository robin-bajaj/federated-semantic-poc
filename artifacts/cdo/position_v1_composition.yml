catalog_format: cdo-federated-semantic-catalog/v1
name: cdo_enterprise_positions
contract:
  name: cdo.position
  version: 1
contract_lineage:
- name: cdo.all
  version: 1
owner: CDO
description: Composed semantic catalog; execution/routing must be implemented separately.
common_attributes:
- position_id
- report_date
- profit_loss
- instrument_code
attribute_definitions:
- name: position_id
  data_type: text
  description: Position identifier
- name: report_date
  data_type: date
  description: Business reporting date
- name: profit_loss
  data_type: numeric
  description: Standardized profit and loss
- name: instrument_code
  data_type: integer
  description: Financial instrument identifier
metric_definitions:
- name: total_profit_loss
  description: Total position profit and loss
  type: simple
  agg: sum
  expr: profit_loss
  fill_nulls_with: 0
implementations:
- source_model: stg_team_a_positions
  semantic_model: team_a_equity_positions
  owner: lob_team_a
  source_definition: models/semantic_models/team_a/team_a_semantics.yml
  included_attributes:
  - position_id
  - report_date
  - profit_loss
  - instrument_code
  agg_time_dimension: report_date
  columns:
  - name: position_id
    data_type: text
    description: Position identifier
    entity:
      type: primary
      name: equity_position_id
  - name: report_date
    data_type: date
    description: Business reporting date
    dimension:
      type: time
    granularity: day
  - name: profit_loss
    data_type: numeric
    description: Standardized profit and loss
  - name: instrument_code
    data_type: integer
    description: Financial instrument identifier
    entity:
      name: instrument
      type: foreign
  - name: mtm
    data_type: numeric
  - name: cash
    data_type: numeric
  metrics:
  - name: equity_total_mtm
    label: Equity Total Mark to Market
    description: POC total MTM of Team A positions at the requested reporting grain.
    type: simple
    agg: sum
    expr: mtm
  - name: equity_total_cash
    label: Equity Total Cash
    description: POC total Cash of Team A positions at the requested reporting grain.
    type: simple
    agg: sum
    expr: cash
  source_team: TEAM_A
- source_model: stg_team_c_positions
  semantic_model: team_c_fi_positions
  owner: lob_team_c
  source_definition: models/semantic_models/team_c/team_c_semantics.yml
  included_attributes:
  - position_id
  - report_date
  - profit_loss
  - instrument_code
  agg_time_dimension: report_date
  columns:
  - name: position_id
    data_type: text
    description: Position identifier
    entity:
      name: team_c_position
      type: primary
  - name: report_date
    data_type: date
    description: Business reporting date
    dimension:
      type: time
    granularity: day
  - name: profit_loss
    data_type: numeric
    description: Standardized profit and loss
  - name: instrument_code
    data_type: integer
    description: Financial instrument identifier
    entity:
      name: instrument
      type: foreign
  - name: settled_cash
    data_type: numeric
  metrics:
  - name: fi_total_settled_cash
    label: Fixed Income Total Settled Cash
    description: POC total settled cash of Team C positions at the requested reporting grain.
    type: simple
    agg: sum
    expr: settled_cash
  source_team: TEAM_C
enterprise_metrics:
- cdo_total_profit_loss
- cdo_position_row_count
composition_selection:
  sources:
  - semantic_model: team_a_equity_positions
    source_team: TEAM_A
    attributes:
    - position_id
    - report_date
    - profit_loss
    - instrument_code
    - mtm
    - cash
    metrics:
    - equity_total_mtm
    - equity_total_cash
  - semantic_model: team_c_fi_positions
    source_team: TEAM_C
    attributes:
    - position_id
    - report_date
    - profit_loss
    - instrument_code
    - settled_cash
    metrics:
    - fi_total_settled_cash
  enterprise_metrics:
  - cdo_total_profit_loss
  - cdo_position_row_count
