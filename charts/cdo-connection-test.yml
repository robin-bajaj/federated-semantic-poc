
title: CDO Executive Positions
source: default
extends: vivid
style:
  frame:
    max_width: 1180
    card_gap: 16
    card_padding: 24
  accent: '#008A00'
  charts:
    kpi:
      align: left
      min_card_width: 260
      default_height: 180
      border:
        width: 1
        color: '#D5E9D8'
        radius: 12
      label:
        font:
          size: 14
          weight: 600
          color: '#496451'
      value:
        font:
          size: 36
          weight: 700
          color: '#005A20'

queries:
  cdo_summary:
    sql: |
      SELECT
        COUNT(*) AS position_count,
        SUM(profit_loss) AS total_profit_loss,
        AVG(profit_loss) AS average_profit_loss
      FROM dbt_federated_poc.fct_cdo_positions
  pnl_by_team:
    sql: |
      SELECT
        source_team AS business_team,
        SUM(profit_loss) AS profit_loss
      FROM dbt_federated_poc.fct_cdo_positions
      GROUP BY source_team
      ORDER BY profit_loss DESC
    formats:
      profit_loss: number_full
  pnl_by_instrument:
    sql: |
      SELECT
        COALESCE(i.instrument_type, 'Unmapped') AS instrument_type,
        SUM(p.profit_loss) AS profit_loss
      FROM dbt_federated_poc.fct_cdo_positions p
      LEFT JOIN dbt_federated_poc.dim_cdo_instruments i
        ON p.instrument_id = i.instrument_code
      GROUP BY COALESCE(i.instrument_type, 'Unmapped')
      ORDER BY profit_loss DESC
    formats:
      profit_loss: number_full

charts:
  total_pnl:
    type: kpi
    label: Total profit and loss
    query: cdo_summary
    value: total_profit_loss
    style:
      background: '#EAF7EB'
      value:
        format: integer
        font:
          size: 44
          color: '#008A00'

  position_count:
    type: kpi
    label: Total positions
    query: cdo_summary
    value: position_count
    style:
      value:
        format: integer

  average_pnl:
    type: kpi
    label: Average profit and loss per position
    query: cdo_summary
    value: average_profit_loss
    style:
      value:
        format: number_full

  pnl_team:
    type: bar
    title: P&L by business team
    query: pnl_by_team
    x: business_team
    y: profit_loss
    style:
      color:
        static: '#008A00'

  pnl_instrument:
    type: bar
    title: P&L by instrument type
    query: pnl_by_instrument
    x: instrument_type
    y: profit_loss
    style:
      color:
        static: '#008A00'

rows:
  - cols:
      - total_pnl
      - position_count
      - average_pnl
  - cols:
      - pnl_team
      - pnl_instrument
