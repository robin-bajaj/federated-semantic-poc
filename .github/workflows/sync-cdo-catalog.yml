name: Sync native CDO semantic model

# After approved Team A/C changes merge, compose the new CDO definition.
# The scheduled run also detects changes in the separate CDO governance repo.
on:
  push:
    branches: [main]
    paths:
      - 'models/semantic_models/team_a/**'
      - 'models/semantic_models/team_c/**'
      - 'scripts/generate_cdo_dbt.py'
      - '.github/workflows/sync-cdo-catalog.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * 1-5'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dbt project
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Install compiler, dbt, and parser dependencies
        run: |
          python -m pip install 'PyYAML>=6.0' 'dbt-core==1.12.6' 'dbt-postgres==1.11.0'
          git clone --depth 1 https://github.com/robin-bajaj/cdo-semantic-governance.git /tmp/cdo-validator
          python -m pip install /tmp/cdo-validator/cdo/validator

      - name: Configure parse-only profile
        run: |
          mkdir -p .ci
          cat > .ci/profiles.yml <<'PROFILE'
          default:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                user: ci
                password: ci
                dbname: ci
                schema: ci
                threads: 1
          PROFILE

      - name: Compile source team semantic models
        run: |
          python -m meta_context_validator.compile_semantics \
            --registry /tmp/cdo-validator/cdo/definitions/position_v1.yml \
            --project .
          dbt parse --profiles-dir .ci --no-partial-parse

      - name: Compose validated catalog from latest Team A and Team C
        run: |
          python -m meta_context_validator.compose_cdo \
            --project . \
            --contract /tmp/cdo-validator/cdo/definitions/position_v1.yml \
            --manifest target/manifest.json \
            --require-semantic-model team_a_equity_positions \
            --require-semantic-model team_c_fi_positions \
            --output /tmp/current_cdo_catalog.yml

      - name: Generate and parse dbt-native CDO semantics
        run: |
          python scripts/generate_cdo_dbt.py \
            --catalog /tmp/current_cdo_catalog.yml \
            --out models/semantic_models/team_cdo/generated
          dbt parse --profiles-dir .ci --no-partial-parse
          test -s target/manifest.json
          test -s target/semantic_manifest.json

      - name: Open PR if native CDO files changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="models/semantic_models/team_cdo/generated"
          # Keep team sources authored; never publish in-run inherited expansions.
          git restore models/semantic_models/team_a models/semantic_models/team_c
          if [ -z "$(git status --porcelain -- "$dir")" ]; then
            echo "Native CDO semantics already current"
            exit 0
          fi
          branch="automation/sync-native-cdo-semantic-model"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add "$dir"
          git commit -m "chore(cdo): regenerate governed enterprise metrics"
          git push --force-with-lease origin "$branch"
          if ! gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create --base main --head "$branch" \
              --title "Sync dbt-native CDO metrics from Team A/C semantics" \
              --body "Compiled and validated current team source definitions, then generated the CDO SQL/YAML and passed dbt parse. Team-owned files are unchanged."
          fi
