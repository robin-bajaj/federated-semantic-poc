name: CDO Semantic Contract CI # Display name shown in GitHub Actions

on:
  pull_request: # Run when a PR targets the repository's main branch
    branches: [main]
  workflow_dispatch: # Allow someone to trigger the workflow manually

permissions:
  contents: read

jobs:
  validate:
    name: Validate CDO contracts and Meta Context
    runs-on: ubuntu-latest # GitHub provides a temporary Ubuntu machine called a runner
    steps: # The remaining steps run on that machine. They are not execute inside dbt Studio
      # This downloads the dbt project code that GitHub is testing
      - name: Checkout PR version of dbt project 
        uses: actions/checkout@v4
        with:
          path: dbt-project
          persist-credentials: false

      # This downloads seperate, centrally maintained validator repository at a pinned revision
      - name: Checkout extended Meta Context validator
        uses: actions/checkout@v4
        with:
          repository: robin-bajaj/cdo-semantic-contract-validator
          ref: 313d1044128cfa3ae74191d76ef35b86acfd32f3 # Pinned to tested central-contract validator revision
          path: contract-validator
          persist-credentials: false

      # CI then installs the required tools
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # This installs dbt, the Postgres adapter, pytest, and our customized validator
      - name: Install dbt and custom validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'dbt-core==1.12.6' \
            'dbt-postgres==1.11.0' \
            pytest \
            ./contract-validator/validator

      # This verifies that the validator's Python unit tests pass
      - name: Run validator unit tests
        run: python -m pytest contract-validator/validator/tests -q

      - name: Configure parse-only dbt profile
        working-directory: dbt-project
        run: |
          mkdir -p .ci
          cat > .ci/profiles.yml <<'PROFILE'
          default:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                user: ci
                password: ci
                dbname: ci
                schema: ci
                threads: 1
          PROFILE

      # The manifest is very important because Python validator does not need to manually search through Team A's or Team C's SQL files. It reads dbt's parsed project metadata instead
      # No database connection or SQL execution is needed for this step. It verifies parsed declarations, not physical warehouse data
      - name: Generate PR manifest without connecting to a warehouse
        working-directory: dbt-project
        run: |
          if [ -f packages.yml ] || [ -f dependencies.yml ]; then
            dbt deps --profiles-dir .ci
          fi
          dbt parse --profiles-dir .ci --no-partial-parse
          test -s target/manifest.json

      #If a mandatory column is missing, or a required Meta:Context rule fails, the command retruns a nonzero exit code and GitHub Actions marks the job as failed
      - name: Validate CDO contract and enterprise business context
        working-directory: dbt-project
        run: |
          test -s ../contract-validator/contracts/cdo/position_v1.yml
          test -s models/semantic_models/team_cdo/enterprise_metrics.yml
          dbt-mc validate models/semantic_models/team_cdo/enterprise_metrics.yml \
            --contracts ../contract-validator/contracts/cdo/position_v1.yml \
            --manifest target/manifest.json

      # Checks that the CDO metric actually has Meta:Context
      # This step ensures required enterprise metric is actually present and contains its context block
      - name: Require certified metric context card
        working-directory: dbt-project
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          from meta_context_validator.cli import _extract_metrics

          path = Path('models/semantic_models/team_cdo/enterprise_metrics.yml')
          data = yaml.safe_load(path.read_text()) or {}
          matching = [
              meta for name, meta in _extract_metrics(data)
              if name == 'enterprise_total_profit_loss'
          ]
          if len(matching) != 1 or not matching[0].get('context'):
              raise SystemExit(
                  'enterprise_total_profit_loss requires one Meta:Context card'
              )
          print('Enterprise metric context exists')
          PY
