# Pull-request quality gate for CDO-governed semantic models.
# Validation only: Team A/C PRs cannot generate CDO snapshots or publish branches.
name: CDO Semantic Contract CI

# Run when changes are proposed to main, or when a maintainer starts it manually.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# The validation job only reads Team A/C and CDO Git content.
# The compiler writes to an ephemeral runner checkout, not to GitHub.
permissions:
  contents: read

jobs:
  validate:
    name: Validate Team A/C CDO contract implementations
    runs-on: ubuntu-latest
    steps:
      # Get the proposed dbt project changes into dbt-project/ so we validate
      # the same Team A/C source YAML and SQL that the PR is introducing.
      - name: Checkout PR version of dbt project
        uses: actions/checkout@v4
        with:
          path: dbt-project
          persist-credentials: false

      # Fetch the separately owned CDO registry, semantic inheritance compiler,
      # contract validator, and unit tests into cdo-governance/.
      # Pinning to a reviewed commit prevents central definition changes from
      # silently changing Team A/C semantics during a pull-request run.
      - name: Checkout pinned CDO governance repository
        uses: actions/checkout@v4
        with:
          repository: robin-bajaj/cdo-semantic-governance
          ref: 3a8326819aa94f95d0794d19a4cd737807d4e0a8 # Reviewed CDO governance commit
          path: cdo-governance
          persist-credentials: false

      # Use a consistent Python version for YAML compilation, tests and dbt.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install pinned dbt Core + Postgres adapter, test tooling and the custom
      # CDO package. dbt still executes metrics; Python only resolves metadata.
      - name: Install dbt and CDO governance package
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'dbt-core==1.12.6' \
            'dbt-postgres==1.11.0' \
            pytest \
            ./cdo-governance

      # Fail early if CDO's inheritance, collision checks or contract logic
      # regress, before compiling the team's semantic declarations.
      - name: Run CDO governance regression tests
        run: python -m pytest cdo-governance/tests -q

      # Validate all centrally governed contracts, including counterparty,
      # before compiling either team's inherited Position semantics.
      - name: Validate CDO_ALL business registry and concept inheritance
        run: python -m cdo_governance.semantic.contract_registry --registry cdo-governance/contracts

      # dbt parse needs a syntactically valid adapter profile. These dummy
      # localhost credentials are intentionally not a real database connection:
      # this CI checks syntax/semantic metadata, NOT warehouse data/results.
      - name: Configure parse-only dbt profile
        working-directory: dbt-project
        run: |
          mkdir -p .ci
          cat > .ci/profiles.yml <<'PROFILE'
          default:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                user: ci
                password: ci
                dbname: ci
                schema: ci
                threads: 1
          PROFILE

      # Resolve Team A/C's custom CDO Position inheritance reference.
      # The compiler reads CDO's Position fields, entities, dimensions, and
      # SUM(profit_loss) formula, merges local additions/aliases, and rewrites
      # the YAML only inside the disposable dbt-project/ checkout.
      # The Python assertions then verify both teams received the four CDO
      # columns, report-date dimension, and correct locally named P&L metric.
      - name: Compile inherited CDO Position semantics
        working-directory: dbt-project
        run: |
          python -m cdo_governance.semantic.semantic_compiler --registry ../cdo-governance/contracts --project . --bindings-output .ci/cdo-resolved-bindings.yml
          python - <<'PY'
          import yaml
          from pathlib import Path
          for team, expected in [
              ('team_a', 'equity_profit_loss'),
              ('team_c', 'fixed_income_profit_loss'),
          ]:
              file = Path(f'models/semantic_models/{team}/{team}_semantics.yml')
              model = yaml.safe_load(file.read_text())['models'][0]
              # The authored uses/include DSL is compile-time input, not native dbt.
              meta = model['config'].get('meta') or {}
              assert not meta, meta
              assert not any('metric_contract' in (m.get('config') or {}).get('meta', {}) for m in model['metrics'])
              cols = {c['name']: c for c in model['columns']}
              assert {'position_id', 'report_date', 'profit_loss', 'instrument_code'} <= set(cols)
              assert cols['report_date']['dimension']['type'] == 'time'
              metrics = [m for m in model['metrics'] if m.get('name') == expected]
              assert len(metrics) == 1
              metric = metrics[0]
              assert (metric['type'], metric['agg'], metric['expr']) == ('simple', 'sum', 'profit_loss')
              print(f'{team}: inherited fields + {expected} => SUM(profit_loss)')
          PY

      # Run dbt's native parser on the expanded (not reference-only) project.
      # dbt deps installs dependencies if declared. --no-partial-parse avoids
      # validating against stale cached metadata. This produces manifest.json
      # and semantic_manifest.json locally but does not publish either.
      - name: Generate PR manifest without connecting to a warehouse
        working-directory: dbt-project
        run: |
          if [ -f packages.yml ] || [ -f dependencies.yml ]; then
            dbt deps --profiles-dir .ci
          fi
          dbt parse --profiles-dir .ci --no-partial-parse
          test -s target/manifest.json
          test -s target/semantic_manifest.json

      # Verify real dbt manifest ↔ ephemeral CDO bindings before database work.
      - name: Validate and compose CDO catalog from parsed native dbt models
        working-directory: dbt-project
        run: |
          python -m cdo_governance.semantic.position_composer \
            --project . \
            --contract ../cdo-governance/contracts \
            --manifest target/manifest.json \
            --bindings .ci/cdo-resolved-bindings.yml \
            --selection ../cdo-governance/compositions/cdo_position_v1.yml \
            --discovery-output .ci/cdo-position-options.yml \
            --output .ci/cdo-current-composition.yml
          test -s .ci/cdo-current-composition.yml
          test -s .ci/cdo-position-options.yml
          python -m cdo_governance.semantic.position_dbt_generator \
            --catalog .ci/cdo-current-composition.yml \
            --out models/semantic_models/team_cdo/generated
          dbt parse --profiles-dir .ci --no-partial-parse
          test -s target/semantic_manifest.json

      # Make all validated candidates visible to CDO reviewers; no UI needed.
      - name: Upload validated CDO composition choices
        uses: actions/upload-artifact@v4
        with:
          name: cdo-position-choices
          path: dbt-project/.ci/cdo-position-options.yml
          if-no-files-found: error

      # Native dbt contract enforcement requires a live database. Keep secrets
      # out of source and skip this credentialed step for fork PRs.
      - name: Build participating Team A/C models with enforced dbt contracts
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: dbt-project
        env:
          DBT_PG_HOST: ${{ secrets.DBT_PG_HOST }}
          DBT_PG_PORT: ${{ secrets.DBT_PG_PORT }}
          DBT_PG_USER: ${{ secrets.DBT_PG_USER }}
          DBT_PG_PASSWORD: ${{ secrets.DBT_PG_PASSWORD }}
          DBT_PG_DBNAME: ${{ secrets.DBT_PG_DBNAME }}
          DBT_PG_SCHEMA: ci_cdo_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for variable in DBT_PG_HOST DBT_PG_USER DBT_PG_PASSWORD DBT_PG_DBNAME; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Missing repository secret: ${variable}"
              exit 1
            fi
          done

          # Quoted heredoc preserves dbt's Jinja environment lookups, rather
          # than interpolating credentials directly into the workflow file.
          cat > .ci/profiles.yml <<'PROFILE'
          default:
            target: ci
            outputs:
              ci:
                type: postgres
                host: "{{ env_var('DBT_PG_HOST') }}"
                port: "{{ env_var('DBT_PG_PORT', '5432') | int }}"
                user: "{{ env_var('DBT_PG_USER') }}"
                password: "{{ env_var('DBT_PG_PASSWORD') }}"
                dbname: "{{ env_var('DBT_PG_DBNAME') }}"
                schema: "{{ env_var('DBT_PG_SCHEMA') }}"
                sslmode: require
                threads: 2
          PROFILE

          dbt debug --profiles-dir .ci --connection
          # Fresh, isolated schema per run; seed the two sources referenced by
          # Team A/C staging SQL before building their contracted relations.
          dbt seed --profiles-dir .ci --select team_a_positions team_c_positions
          # Validate only participating Team A/C physical contracts.
          # No CDO composition, snapshot or deployment occurs in this workflow.
          dbt build --profiles-dir .ci --select stg_team_a_positions stg_team_c_positions
