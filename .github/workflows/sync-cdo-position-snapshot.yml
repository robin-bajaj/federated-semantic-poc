name: Sync CDO Position Snapshot

# Single CDO generator for validated unmerged PR candidates and post-merge
# approved source. Only post-merge runs open official CDO review pull requests.
on:
  workflow_call:
    inputs:
      mode:
        description: candidate for unmerged PR
        required: true
        type: string
      source_ref:
        description: Exact source SHA
        required: true
        type: string
      source_repository:
        description: Team source repository
        required: true
        type: string
      pr_number:
        description: Source team PR number (for candidate isolation)
        required: true
        type: number
  push:
    branches: [main]
    paths:
      - 'models/semantic_models/team_a/**'
      - 'models/semantic_models/team_c/**'
      - 'scripts/generate_cdo_dbt.py'
      - '.github/workflows/sync-cdo-position-snapshot.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * 1-5'

permissions:
  contents: read

concurrency:
  group: sync-cdo-position-${{ inputs.mode == 'candidate' && format('pr-{0}', inputs.pr_number) || 'main' }}
  cancel-in-progress: false

jobs:
  generate:
    name: Compile and generate native CDO SQL/YAML
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR candidate or approved main
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ inputs.source_ref || 'main' }}
          persist-credentials: false

      - name: Install compiler, dbt, and parser dependencies
        run: |
          python -m pip install 'PyYAML>=6.0' 'dbt-core==1.12.6' 'dbt-postgres==1.11.0'
          git clone https://github.com/robin-bajaj/cdo-semantic-governance.git /tmp/cdo-validator
          git -C /tmp/cdo-validator checkout --detach e3681a4002e3d8dda53a2de43d67410b61a9f5e1
          python -m pip install /tmp/cdo-validator/cdo/validator

      - name: Configure parse-only profile
        run: |
          mkdir -p .ci
          cat > .ci/profiles.yml <<'PROFILE'
          default:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                user: ci
                password: ci
                dbname: ci
                schema: ci
                threads: 1
          PROFILE

      - name: Compile source team semantic models
        run: |
          python -m meta_context_validator.compile_semantics \
            --registry /tmp/cdo-validator/cdo/definitions/position_v1.yml \
            --project .
          dbt parse --profiles-dir .ci --no-partial-parse

      - name: Compose validated CDO Position v1 catalog
        run: |
          python -m meta_context_validator.compose_cdo \
            --project . \
            --contract /tmp/cdo-validator/cdo/definitions/position_v1.yml \
            --manifest target/manifest.json \
            --require-semantic-model team_a_equity_positions \
            --require-semantic-model team_c_fi_positions \
            --output /tmp/current_cdo_catalog.yml

      - name: Fully regenerate and parse native CDO Position snapshot
        run: |
          python -m meta_context_validator.generate_cdo_dbt \
            --catalog /tmp/current_cdo_catalog.yml \
            --out models/semantic_models/team_cdo/generated
          dbt parse --profiles-dir .ci --no-partial-parse
          test -s target/manifest.json
          test -s target/semantic_manifest.json



      - name: Transfer native CDO candidate to snapshot job
        uses: actions/upload-artifact@v4
        with:
          name: cdo-position-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            models/semantic_models/team_cdo/generated/cdo_enterprise_positions.sql
            models/semantic_models/team_cdo/generated/cdo_enterprise_positions.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Commit candidate or open CDO review PR
    needs: generate
    if: inputs.mode != 'candidate' || inputs.source_repository == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A privileged job must never execute code checked out from a team PR.
      - name: Checkout trusted main for Git snapshot publication
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Download generated CDO snapshot
        uses: actions/download-artifact@v4
        with:
          name: cdo-position-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: models/semantic_models/team_cdo/generated/

      - name: Compare snapshot and create or update CDO review PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot_dir="models/semantic_models/team_cdo/generated"
          if [ "${{ inputs.mode }}" = "candidate" ]; then
            snapshot_branch="automation/cdo-position-pr-${{ inputs.pr_number }}"
          else
            snapshot_branch="automation/sync-cdo-position-snapshot"
          fi
          generated_sql="$snapshot_dir/cdo_enterprise_positions.sql"
          generated_yaml="$snapshot_dir/cdo_enterprise_positions.yml"

          # A complete snapshot is always generated from CURRENT source, not
          # patched on top of an old generated file. Both artifacts are required.
          test -s "$generated_sql"
          test -s "$generated_yaml"

          # The compilation step operates on a disposable checkout. Never
          # commit expanded Team A/C source declarations back to main.

          # Candidates are isolated by team PR number; only post-merge publishes a CDO PR.
          # Compare the entire tracked snapshot against the one on main.
          # This also supports FIRST creation when the files don't yet exist.
          if [ -z "$(git status --porcelain -- "$snapshot_dir")" ]; then
            echo "CDO Position snapshot already matches main; no PR needed."
            exit 0
          fi

          source_commit="$(git rev-parse HEAD)"
          governance_commit="e3681a4002e3d8dda53a2de43d67410b61a9f5e1"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # This automation branch is disposable. Never modify main or
          # generated/production directly; merge the reviewed snapshot PR.
          git checkout -B "$snapshot_branch"
          git add -A -- "$snapshot_dir"
          git diff --cached --quiet && exit 0
          git commit -m "chore(cdo): refresh Position v1 semantic snapshot"

          # Lease protects any unexpected edits to the automation branch.
          git fetch origin "refs/heads/$snapshot_branch:refs/remotes/origin/$snapshot_branch" || true
          expected=""
          if git rev-parse --verify -q "refs/remotes/origin/$snapshot_branch" >/dev/null; then
            expected="$(git rev-parse "refs/remotes/origin/$snapshot_branch")"
          fi
          git push --force-with-lease="refs/heads/$snapshot_branch:$expected" \
            origin "HEAD:refs/heads/$snapshot_branch"

          if [ "${{ inputs.mode }}" = "candidate" ]; then
            echo "Updated pre-merge candidate snapshot for Team PR #${{ inputs.pr_number }} on $snapshot_branch"
            exit 0
          fi

          pr_number="$(gh pr list --head "$snapshot_branch" --base main --state open --json number --jq '.[0].number')"
          pr_title="Sync CDO Position Snapshot — Team A + Team C"
          pr_body="$(cat <<EOF
          ## Purpose
          Initial generation or complete replacement of the approved CDO Position v1 snapshot.

          ## Snapshot artifacts
          - \`$generated_sql\` — UNION ALL view of the governed Team A/C positions.
          - \`$generated_yaml\` — dbt-native CDO Position entity, dimensions and supported CDO metrics.

          ## Provenance
          - Federated source commit: \`$source_commit\`
          - CDO governance commit: \`$governance_commit\`
          - Governed interface: \`cdo.position\` v1
          - Generated using the current approved Team A/C semantics; no incremental appending.

          ## Validation and release
          - Compiled Team A/C inheritance, validated CDO composition, and passed dbt parse.
          - Only the generated CDO SQL/YAML are committed. Authored Team A/C YAML is unchanged.
          - Requires review and merge to \`main\` before Release.
          - Does **not** write \`generated/production\`, deploy Neon, or publish dbt Cloud.
          EOF
          )"
          if [ -z "$pr_number" ]; then
            gh pr create --base main --head "$snapshot_branch" \
              --title "$pr_title" --body "$pr_body"
          else
            gh pr edit "$pr_number" --title "$pr_title" --body "$pr_body"
            echo "Updated CDO snapshot PR #$pr_number"
          fi
