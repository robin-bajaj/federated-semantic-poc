name: CDO Semantic Model Release

# Every approved change to main goes through the same compile/validate/generate gate.
# Pull requests are validation-only. Main releases require a protected environment.
# Run after reviewed, generated CDO artifacts are merged to main.
# Team changes alone trigger CI and the Sync PR, not a premature deploy.
on:
  pull_request:
    branches: [main]
    paths:
      - 'models/semantic_models/team_cdo/generated/**'
      - '.github/workflows/cdo-semantic-release.yml'
  push:
    branches: [main]
    paths:
      - 'models/semantic_models/team_cdo/generated/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdo-semantic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dbt project
        uses: actions/checkout@v4
        with:
          path: dbt-project
          persist-credentials: false

      - name: Checkout CDO governance source
        uses: actions/checkout@v4
        with:
          repository: robin-bajaj/cdo-semantic-governance
          ref: dbcddc0cf58d05d393f95943ae954577c2e0957b # Reviewed governance revision shared by CI/Sync/Publish
          path: contract-validator
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install compiler and dbt
        run: |
          python -m pip install 'dbt-core==1.12.6' 'dbt-postgres==1.11.0' pytest ./contract-validator/cdo/validator

      - name: Configure offline parse profile
        working-directory: dbt-project
        run: |
          mkdir -p .ci
          cat > .ci/profiles.yml <<'PROFILE'
          default:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                user: ci
                password: ci
                dbname: ci
                schema: ci
                threads: 1
          PROFILE

      - name: Validate CDO compiler
        run: python -m pytest contract-validator/cdo/validator/tests -q

      - name: Compile Team A and Team C inheritance
        working-directory: dbt-project
        run: |
          python -m meta_context_validator.compile_semantics \
            --registry ../contract-validator/cdo/definitions/position_v1.yml \
            --project .
          if [ -f packages.yml ] || [ -f dependencies.yml ]; then
            dbt deps --profiles-dir .ci
          fi
          dbt parse --profiles-dir .ci --no-partial-parse

      - name: Compose validated CDO catalog
        working-directory: dbt-project
        run: |
          python -m meta_context_validator.compose_cdo \
            --project . \
            --contract ../contract-validator/cdo/definitions/position_v1.yml \
            --manifest target/manifest.json \
            --require-semantic-model team_a_equity_positions \
            --require-semantic-model team_c_fi_positions \
            --output /tmp/cdo_composition.yml

      - name: Generate native CDO SQL and semantic YAML, then parse
        working-directory: dbt-project
        run: |
          python -m meta_context_validator.generate_cdo_dbt \
            --catalog /tmp/cdo_composition.yml \
            --out models/semantic_models/team_cdo/generated
          dbt parse --profiles-dir .ci --no-partial-parse
          test -s target/manifest.json
          test -s target/semantic_manifest.json

      - name: Enforce committed native CDO artifacts match generated output
        working-directory: dbt-project
        run: |
          git diff --exit-code -- \
            models/semantic_models/team_cdo/generated/cdo_enterprise_positions.sql \
            models/semantic_models/team_cdo/generated/cdo_enterprise_positions.yml || {
              echo "::error::CDO generated files are out of sync. Run Sync CDO Position Snapshot and merge its review PR before release."
              exit 1
            }
          test -z "$(git ls-files --others --exclude-standard -- models/semantic_models/team_cdo/generated)"

      - name: Upload validated release inputs
        uses: actions/upload-artifact@v4
        with:
          name: validated-cdo-model
          path: |
            dbt-project/models/semantic_models/team_cdo/generated/cdo_enterprise_positions.sql
            dbt-project/models/semantic_models/team_cdo/generated/cdo_enterprise_positions.yml
            dbt-project/target/semantic_manifest.json
          if-no-files-found: error

  deploy:
    needs: validate-and-compose
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cdo-release
    steps:
      - name: Checkout reviewed dbt project
        uses: actions/checkout@v4
        with:
          path: dbt-project
          persist-credentials: false

      - name: Checkout CDO governance source
        uses: actions/checkout@v4
        with:
          repository: robin-bajaj/cdo-semantic-governance
          ref: dbcddc0cf58d05d393f95943ae954577c2e0957b # Reviewed governance revision shared by CI/Sync/Publish
          path: contract-validator
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install compiler and dbt
        run: |
          python -m pip install 'dbt-core==1.12.6' 'dbt-postgres==1.11.0' ./contract-validator/cdo/validator

      - name: Compile inherited semantic declarations
        working-directory: dbt-project
        run: |
          python -m meta_context_validator.compile_semantics \
            --registry ../contract-validator/cdo/definitions/position_v1.yml \
            --project .

      - name: Validate release credentials and configure Neon PostgreSQL
        working-directory: dbt-project
        env:
          DBT_PG_HOST: ${{ secrets.DBT_PG_HOST }}
          DBT_PG_PORT: ${{ secrets.DBT_PG_PORT }}
          DBT_PG_USER: ${{ secrets.DBT_PG_USER }}
          DBT_PG_PASSWORD: ${{ secrets.DBT_PG_PASSWORD }}
          DBT_PG_DBNAME: ${{ secrets.DBT_PG_DBNAME }}
          DBT_CDO_RELEASE_SCHEMA: ${{ vars.DBT_CDO_RELEASE_SCHEMA }}
        run: |
          set -euo pipefail
          for key in DBT_PG_HOST DBT_PG_USER DBT_PG_PASSWORD DBT_PG_DBNAME DBT_CDO_RELEASE_SCHEMA; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing secret/variable: $key"
              exit 1
            fi
          done
          if ! [[ "$DBT_CDO_RELEASE_SCHEMA" =~ ^[a-z][a-z0-9_]*$ ]]; then
            echo "::error::Invalid DBT_CDO_RELEASE_SCHEMA; use lowercase letters, digits, underscore"
            exit 1
          fi
          mkdir -p .ci
          cat > .ci/profiles.yml <<'PROFILE'
          default:
            target: release
            outputs:
              release:
                type: postgres
                host: "{{ env_var('DBT_PG_HOST') }}"
                port: "{{ env_var('DBT_PG_PORT', '5432') | int }}"
                user: "{{ env_var('DBT_PG_USER') }}"
                password: "{{ env_var('DBT_PG_PASSWORD') }}"
                dbname: "{{ env_var('DBT_PG_DBNAME') }}"
                schema: "{{ env_var('DBT_CDO_RELEASE_SCHEMA') }}"
                sslmode: require
                threads: 2
          PROFILE

      - name: Build standardized team models and CDO enterprise view
        working-directory: dbt-project
        env:
          DBT_PG_HOST: ${{ secrets.DBT_PG_HOST }}
          DBT_PG_PORT: ${{ secrets.DBT_PG_PORT }}
          DBT_PG_USER: ${{ secrets.DBT_PG_USER }}
          DBT_PG_PASSWORD: ${{ secrets.DBT_PG_PASSWORD }}
          DBT_PG_DBNAME: ${{ secrets.DBT_PG_DBNAME }}
          DBT_CDO_RELEASE_SCHEMA: ${{ vars.DBT_CDO_RELEASE_SCHEMA }}
        run: |
          set -euo pipefail
          if [ -f packages.yml ] || [ -f dependencies.yml ]; then
            dbt deps --profiles-dir .ci
          fi
          dbt debug --profiles-dir .ci --connection
          dbt build --profiles-dir .ci --target release --select +cdo_enterprise_positions

      - name: Publish release manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cdo-deployed-manifests
          path: |
            dbt-project/target/manifest.json
            dbt-project/target/semantic_manifest.json
            dbt-project/target/run_results.json
          if-no-files-found: error
