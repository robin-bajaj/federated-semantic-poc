# Triggered by a manual merge into generated/production; a manual run can also
# bootstrap the branch from main if it does not yet exist.
# One run owns compilation, composition, native CDO generation, Neon build and Git publish.
# The hosted dbt Cloud job remains a separate action and is NOT invoked here.
name: Promote CDO Semantic Models to Production

on:
  push:
    branches:
      - generated/production
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-cdo-generated-production
  cancel-in-progress: false

jobs:
  promote:
    name: Generate, validate, build and promote CDO Position
    # Preserve the existing protected database-release approval gate.
    environment: cdo-release
    if: github.ref == 'refs/heads/generated/production' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean approved main source for deterministic compilation
        uses: actions/checkout@v4
        with:
          ref: main
          path: dbt-project
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare existing deployment branch or initialize it from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: deployment-project
          fetch-depth: 0

      - name: Select deployment base and verify approved main
        working-directory: deployment-project
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          if git ls-remote --exit-code --heads origin generated/production >/dev/null; then
            git fetch origin '+refs/heads/generated/production:refs/remotes/origin/generated/production'
            # For push-triggered promotion use precisely the triggering commit,
            # never a potentially newer branch tip from a concurrent change.
            if [ "$EVENT_NAME" = "push" ]; then
              git checkout -B promotion-source "${GITHUB_SHA}"
            else
              git checkout -B promotion-source origin/generated/production
            fi
            git merge-base --is-ancestor origin/main HEAD || {
              echo "::error::Merge the current main into generated/production before promotion."
              exit 1
            }
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # First-ever promotion: there is no deployment branch yet.
            git checkout -B promotion-source origin/main
          else
            echo "::error::Deployment branch disappeared during a push-triggered run."
            exit 1
          fi

      - name: Checkout approved CDO governance compiler, composer and generator
        uses: actions/checkout@v4
        with:
          repository: robin-bajaj/cdo-semantic-governance
          ref: 2bec75b20f8dd01d0be3ff96a8536f935cfe1635
          path: cdo-governance
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dbt and CDO governance package
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'dbt-core==1.12.6' 'dbt-postgres==1.11.0' pytest ./cdo-governance

      - name: Run CDO governance regression tests
        run: python -m pytest cdo-governance/tests -q

      - name: Validate CDO_ALL and versioned business concepts
        run: python -m cdo_governance.semantic.contract_registry --registry cdo-governance/contracts

      - name: Compile team inheritance and parse native dbt project
        working-directory: dbt-project
        run: |
          python -m cdo_governance.semantic.semantic_compiler \
            --registry ../cdo-governance/contracts \
            --project . \
            --bindings-output .ci/cdo-resolved-bindings.yml
          mkdir -p .ci
          cat > .ci/profiles.yml <<'PROFILE'
          default:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                user: ci
                password: ci
                dbname: ci
                schema: ci
                threads: 1
          PROFILE
          if [ -f packages.yml ] || [ -f dependencies.yml ]; then
            dbt deps --profiles-dir .ci
          fi
          dbt parse --profiles-dir .ci --no-partial-parse

      - name: Compose both teams into temporary CDO catalog
        working-directory: dbt-project
        run: |
          python -m cdo_governance.semantic.position_composer \
            --project . \
            --contract ../cdo-governance/contracts \
            --manifest target/manifest.json \
            --require-semantic-model team_a_equity_positions \
            --require-semantic-model team_c_fi_positions \
            --bindings .ci/cdo-resolved-bindings.yml \
            --output /tmp/current_cdo_catalog.yml

      - name: Generate native CDO SQL/YAML and validate semantic manifest
        working-directory: dbt-project
        run: |
          python -m cdo_governance.semantic.position_dbt_generator \
            --catalog /tmp/current_cdo_catalog.yml \
            --out models/semantic_models/team_cdo/generated
          test -s models/semantic_models/team_cdo/generated/cdo_enterprise_positions.sql
          test -s models/semantic_models/team_cdo/generated/cdo_enterprise_positions.yml
          dbt parse --profiles-dir .ci --no-partial-parse
          test -s target/manifest.json
          test -s target/semantic_manifest.json

      - name: Upload composed Team A/C catalog for review
        uses: actions/upload-artifact@v4
        with:
          name: cdo-position-composition-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/current_cdo_catalog.yml
          if-no-files-found: error
          retention-days: 14

      - name: Configure protected Neon PostgreSQL release profile
        working-directory: dbt-project
        env:
          DBT_PG_HOST: ${{ secrets.DBT_PG_HOST }}
          DBT_PG_PORT: ${{ secrets.DBT_PG_PORT }}
          DBT_PG_USER: ${{ secrets.DBT_PG_USER }}
          DBT_PG_PASSWORD: ${{ secrets.DBT_PG_PASSWORD }}
          DBT_PG_DBNAME: ${{ secrets.DBT_PG_DBNAME }}
          DBT_CDO_RELEASE_SCHEMA: ${{ vars.DBT_CDO_RELEASE_SCHEMA }}
        shell: bash
        run: |
          set -euo pipefail
          for key in DBT_PG_HOST DBT_PG_USER DBT_PG_PASSWORD DBT_PG_DBNAME DBT_CDO_RELEASE_SCHEMA; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required secret/variable: $key"
              exit 1
            fi
          done
          if ! [[ "$DBT_CDO_RELEASE_SCHEMA" =~ ^[a-z][a-z0-9_]*$ ]]; then
            echo "::error::Invalid DBT_CDO_RELEASE_SCHEMA"
            exit 1
          fi
          cat > .ci/profiles.yml <<'PROFILE'
          default:
            target: release
            outputs:
              release:
                type: postgres
                host: "{{ env_var('DBT_PG_HOST') }}"
                port: "{{ env_var('DBT_PG_PORT', '5432') | int }}"
                user: "{{ env_var('DBT_PG_USER') }}"
                password: "{{ env_var('DBT_PG_PASSWORD') }}"
                dbname: "{{ env_var('DBT_PG_DBNAME') }}"
                schema: "{{ env_var('DBT_CDO_RELEASE_SCHEMA') }}"
                sslmode: require
                threads: 2
          PROFILE

      - name: Build Team A/C staging and CDO unified view in Neon
        working-directory: dbt-project
        env:
          DBT_PG_HOST: ${{ secrets.DBT_PG_HOST }}
          DBT_PG_PORT: ${{ secrets.DBT_PG_PORT }}
          DBT_PG_USER: ${{ secrets.DBT_PG_USER }}
          DBT_PG_PASSWORD: ${{ secrets.DBT_PG_PASSWORD }}
          DBT_PG_DBNAME: ${{ secrets.DBT_PG_DBNAME }}
          DBT_CDO_RELEASE_SCHEMA: ${{ vars.DBT_CDO_RELEASE_SCHEMA }}
        run: |
          dbt debug --profiles-dir .ci --target release --connection
          dbt build --profiles-dir .ci --target release --select +cdo_enterprise_positions

      - name: Commit native team and CDO output to deployment branch
        working-directory: deployment-project
        shell: bash
        run: |
          set -euo pipefail
          source_dir="../dbt-project/models/semantic_models"
          target_dir="models/semantic_models"
          # Generate CDO output even when team_cdo/ does not exist on main.
          mkdir -p "$target_dir/team_a" "$target_dir/team_c" "$target_dir/team_cdo/generated"
          cp "$source_dir/team_a/team_a_semantics.yml" "$target_dir/team_a/team_a_semantics.yml"
          cp "$source_dir/team_c/team_c_semantics.yml" "$target_dir/team_c/team_c_semantics.yml"
          cp "$source_dir/team_cdo/generated/cdo_enterprise_positions.sql" "$target_dir/team_cdo/generated/cdo_enterprise_positions.sql"
          cp "$source_dir/team_cdo/generated/cdo_enterprise_positions.yml" "$target_dir/team_cdo/generated/cdo_enterprise_positions.yml"
          # Persist inspectable semantic composition metadata outside dbt models.
          # It is generated from the same validated Team A/C inputs as CDO SQL/YAML.
          mkdir -p artifacts/cdo
          cp /tmp/current_cdo_catalog.yml artifacts/cdo/position_v1_composition.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            models/semantic_models/team_a/team_a_semantics.yml \
            models/semantic_models/team_c/team_c_semantics.yml \
            models/semantic_models/team_cdo/generated/cdo_enterprise_positions.sql \
            models/semantic_models/team_cdo/generated/cdo_enterprise_positions.yml \
            artifacts/cdo/position_v1_composition.yml

          # A bootstrap run must push the new branch even if no changes were
          # needed; this also makes repeat promotions idempotent.
          if ! git diff --cached --quiet; then
            git commit -m "build(cdo): compile Team A/C and compose enterprise Position"
          fi
          git push origin HEAD:refs/heads/generated/production

      - name: Upload successful build and semantic manifests
        uses: actions/upload-artifact@v4
        with:
          name: promoted-cdo-manifests
          path: |
            dbt-project/target/manifest.json
            dbt-project/target/semantic_manifest.json
            dbt-project/target/run_results.json
          if-no-files-found: error

      - name: Handoff to hosted dbt Cloud deployment
        run: |
          echo "Native project prepared on generated/production (manual merge or first-time bootstrap)."
          echo "Run the dbt Cloud job tracking generated/production to refresh the hosted Semantic Layer."
