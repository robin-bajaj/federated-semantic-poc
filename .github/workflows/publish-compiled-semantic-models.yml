# Release-only workflow: turn Team A/C's short CDO inheritance declarations
# into native dbt YAML in an automatically maintained deployment branch.
# This does not update the hosted dbt Semantic Layer or Power BI by itself.
name: Publish Compiled CDO Semantic Models (Manual)

# This workflow prepares a native dbt deployment branch. It DOES NOT trigger
# a dbt Cloud deployment or activate the production Semantic Layer by itself.
# Manual trigger: merging into main will NOT create generated/production.
# Run from Actions > Publish Compiled CDO Semantic Models > Run workflow.
on:
  workflow_dispatch:

# This Team-controlled workflow must push the generated branch to this repo.
# The separate CDO checkout is read-only; CDO never writes Team A/C Git files.
permissions:
  contents: write

# Do not publish two releases simultaneously, which could race on the branch.
concurrency:
  group: publish-compiled-semantic-models
  cancel-in-progress: false

jobs:
  compile-and-publish:
    runs-on: ubuntu-latest
    steps:
      # Fetch main (our single, developer-maintained source of truth).
      # Keep Git history so the generated branch can be based on main.
      - name: Checkout authoritative Team A/C dbt source
        uses: actions/checkout@v4
        with:
          ref: main
          path: dbt-project
          fetch-depth: 0

      # Fetch CDO's approved Position contract and the inheritance compiler.
      # A pinned commit keeps every release reproducible until teams opt into
      # an updated CDO version; persist-credentials:false avoids CDO Git writes.
      - name: Checkout pinned CDO definition and compiler (read-only)
        uses: actions/checkout@v4
        with:
          repository: robin-bajaj/cdo-semantic-contract-validator
          ref: 786bbd55e8a01658a1c5a220b572035d52bf4278
          path: contract-validator
          persist-credentials: false

      # The custom compiler and its tests run in Python; dbt also uses Python.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pin dbt/parser versions and install the custom CDO compiler package.
      # This does not install or configure a production warehouse connection.
      - name: Install dbt and the CDO validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'dbt-core==1.12.6' 'dbt-postgres==1.11.0' pytest ./contract-validator/cdo/validator

      # Fail the release before publishing if the central compiler regresses.
      - name: Run compiler unit tests
        run: python -m pytest contract-validator/cdo/validator/tests -q

      # Expand extends:cdo.position for both teams inside a disposable checkout.
      # Inherit CDO columns/entities/dimensions + SUM(profit_loss), while keeping
      # team-specific aliases and fields. main remains reference-only in Git.
      - name: Compile the complete semantic model in this release workspace
        working-directory: dbt-project
        run: |
          python -m meta_context_validator.compile_semantics \
            --registry ../contract-validator/cdo/definitions/position_v1.yml \
            --project .

      # Check that dbt parses the expanded YAML and produces a semantic manifest.
      # Dummy localhost Postgres details are sufficient for parse-only checks;
      # NO warehouse tables are built and no metric values are queried here.
      # Meta:Context and CDO column/type contract checks must also pass.
      - name: Validate expanded native dbt project
        working-directory: dbt-project
        run: |
          mkdir -p .ci
          cat > .ci/profiles.yml <<'PROFILE'
          default:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                user: ci
                password: ci
                dbname: ci
                schema: ci
                threads: 1
          PROFILE
          if [ -f packages.yml ] || [ -f dependencies.yml ]; then
            dbt deps --profiles-dir .ci
          fi
          dbt parse --profiles-dir .ci --no-partial-parse
          test -s target/semantic_manifest.json
          dbt-mc validate models/semantic_models/team_cdo/enterprise_metrics.yml \
            --contracts ../contract-validator/cdo/definitions/position_v1.yml \
            --manifest target/manifest.json

      # ONLY after validation: commit expanded Team A/C YAML to a generated
      # branch. Other project files come from the same checked-out main commit.
      # This creates generated/production on the first successful run and
      # updates it on later runs; it never commits generated YAML to main.
      - name: Publish generated project on Team A-controlled deployment branch
        working-directory: dbt-project
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Identify the automation rather than pretending a developer authored
          # the expanded files.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # No external file or generated manifest is pushed into main.
          # Commit only the two expanded semantic YAML files; all other
          # dbt project files are inherited from the checked-out main commit.
          git add models/semantic_models/team_a/team_a_semantics.yml
          git add models/semantic_models/team_c/team_c_semantics.yml
          # Stop if no compilations changed the checked-out semantic YAML.
          git diff --cached --quiet && { echo "No compiled changes to commit"; exit 1; }

          git commit -m "build: compile CDO Position semantics from main ${SOURCE_COMMIT}"
          # Determine the current remote branch head, if it already exists.
          # An empty expected SHA means the first publish must create the branch.
          git fetch origin '+refs/heads/generated/production:refs/remotes/origin/generated/production' || true
          if git rev-parse --verify -q refs/remotes/origin/generated/production >/dev/null; then
            expected="$(git rev-parse refs/remotes/origin/generated/production)"
          else
            expected=""
          fi
          # The generated branch is regenerated from main, never edited by hand.
          # A lease prevents overwriting an unexpected concurrent branch update.
          git push --force-with-lease="refs/heads/generated/production:${expected}" \
            origin HEAD:refs/heads/generated/production

      # Publishing a Git branch is NOT a dbt Cloud deployment. A separate dbt
      # Cloud environment must track generated/production and run its own parse
      # before the hosted Semantic Layer / Power BI can query new definitions.
      - name: Deployment handoff reminder
        run: |
          echo "Compiled Git branch: generated/production"
          echo "Configure a dbt Cloud production environment to checkout this branch."
          echo "This workflow does NOT publish the hosted Semantic Layer by itself."
