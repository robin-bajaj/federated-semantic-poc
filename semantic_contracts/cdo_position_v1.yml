# Central CDO Position contract, validated by the extended dbt-mc CLI.
# This schema is custom metadata, not a native dbt resource.
name: cdo.position
version: 1

required_models:
  - stg_team_a_positions
  - stg_team_c_positions

required_columns:
  position_id: text
  report_date: date
  profit_loss: numeric
  instrument_code: integer

# POC checks the declared dbt manifest schema; dbt build will be separate.
require_native_contract: false
