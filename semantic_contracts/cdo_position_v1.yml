# CDO Position v1 — custom schema consumed by our extended dbt-mc validator.
# Unlike native dbt model contracts, this governs mandatory common fields across teams.
name: cdo.position
version: 1
required_models:
  - stg_team_a_positions
  - stg_team_c_positions
required_columns:
  position_id: text
  report_date: date
  profit_loss: numeric
  instrument_code: integer

# Existing staging models are not yet configured with native enforced contracts.
require_native_contract: false
