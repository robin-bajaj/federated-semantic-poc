version: 2

models:
  - name: stg_fi_transaction
    description: >
      One row per FI transaction.
      Each transaction belongs to an account.

    semantic_model:
      enabled: true
      name: team_fi_transaction

    columns:
      - name: transaction_id
        data_type: text
        entity:
          name: team_fi_transaction_id
          type: primary
        data_tests:
          - not_null
          - unique

      - name: account_id
        data_type: text
        entity:
          name: team_fi_account_id
          type: foreign
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_fi_account')
                field: account_id

      - name: transaction_type
        data_type: text
        dimension:
          type: categorical

          