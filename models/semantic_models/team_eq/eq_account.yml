version: 2

models:
  - name: stg_eq_account
    description: >
      One row per EQ account.
      Each account belongs to a customer.

    semantic_model:
      enabled: true
      name: team_eq_account

    columns:
      - name: account_id
        data_type: text
        entity:
          name: team_eq_account_id
          type: primary
        data_tests:
          - not_null
          - unique

      - name: customer_id # Identifies the physical column in stg_eq_account
        data_type: text # Documents the column's data type
        entity:
          name: team_eq_customer_id # Gives the relationship a common semantic entity name
          type: foreign # Tells MetricFlow that Account references the Customer entity
        data_tests:
          - not_null
          - relationships: # Checks whether the referenced customer IDs actually exist
              arguments:
                to: ref('stg_eq_customer')
                field: customer_id

      - name: account_type
        data_type: text
        dimension:
          type: categorical