version: 2

models:
  - name: fct_cdo_positions
    description: >
      CDO Common Position model combining
      Team A and Team C positions.
    # config: 
    #   group: enterprise_cdo
    #   access: private
    
    semantic_model:
      enabled: true
      name: team_cdo_positions
      group: enterprise_cdo

    agg_time_dimension: report_date

    columns:
      - name: cdo_position_key
        entity:
          name: cdo_position
          type: primary

      # - name: position_id
      #   reference: team_a_semantics.position_id

      - name: report_date
        granularity: day
        dimension:
          type: time

      - name: source_team
        dimension:
          type: categorical

      - name: instrument_id
        entity:
          name: cdo_instrument
          type: foreign

    metrics:
      - name: cdo_total_profit_loss
        label: CDO Total Profit and Loss
        type: simple
        agg: sum
        expr: profit_loss

      - name: cdo_position_count
        label: CDO Position Count
        type: simple
        agg: count
        expr: cdo_position_key

metrics:
  - name: enterprise_avg_profit_loss_per_position
    label: Enterprise Average Profit and Loss per Position
    description: >
      Average enterprise Profit and Loss per position.
      Reuses the enterprise metric composed from
      Team A and Team C, and the position count
      defined on the CDO common Position model.

    type: derived

    expr: >
      coalesce(enterprise_pnl, 0) * 1.0
      / nullif(position_count, 0)

    input_metrics:
      - name: enterprise_total_profit_loss
        alias: enterprise_pnl

      - name: cdo_position_count
        alias: position_count