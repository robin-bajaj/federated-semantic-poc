
version: 2

anchors:

  # Shared CDO Position definition
  - &cdo_position
      description: >
        Enterprise Position model shared by
        EQ and FI implementations.

      config:
        access: public
        materialized: view
        contract:
          enforced: true

      agg_time_dimension: report_date

      columns:
        - &position_key
          name: cdo_position_key
          data_type: text
          entity:
            name: cdo_position
            type: primary
          data_tests:
            - not_null
            - unique

        - &source_team
          name: source_team
          data_type: text
          dimension:
            type: categorical
          data_tests:
            - not_null
            - accepted_values:
                arguments:
                  values: ['EQ', 'FI']

        - &source_position_id
          name: source_position_id
          data_type: text
          dimension:
            type: categorical

        - &source_customer_id
          name: source_customer_id
          data_type: text

        - &report_date
          name: report_date
          data_type: date
          granularity: day
          dimension:
            type: time
          data_tests:
            - not_null

        - &profit_loss
          name: profit_loss
          data_type: numeric(18,2)

      metrics:
        - &total_profit_metric
          name: cdo_enterprise_total_profit
          type: simple
          label: CDO Enterprise Total Profit
          description: >
            Total profit across EQ and FI positions.
          agg: sum
          expr: profit_loss

models:

  # =============================
  # CDO implementation
  # =============================
  
  - name: stg_cdo
    <<: *cdo_position

    semantic_model:
      enabled: true
      name: cdo_position

  # =============================
  # EQ implementation
  # =============================

  - name: stg_eq_position
    <<: *cdo_position

    description: EQ Position implementation

    semantic_model:
      enabled: true
      name: team_eq_position

    columns:
      - <<: *position_key
        name: position_id
        entity:
          name: team_eq_position
          type: primary

      - *report_date
      - *profit_loss

      - name: trader_name
        data_type: text
        dimension:
          type: categorical

      - name: desk_code
        data_type: text
        dimension:
          type: categorical

    metrics:
      - <<: *total_profit_metric
        name: team_eq_total_profit
        label: EQ Total Profit

  # =============================
  # FI implementation
  # =============================

  - name: stg_fi_position
    <<: *cdo_position

    description: FI Position implementation

    semantic_model:
      enabled: true
      name: team_fi_position

    columns:
      - <<: *position_key
        name: position_id
        entity:
          name: team_fi_position
          type: primary

      - *report_date
      - *profit_loss

      - name: bond_type
        data_type: text
        dimension:
          type: categorical

    metrics:
      - <<: *total_profit_metric
        name: team_fi_total_profit
        label: FI Total Profit
