version: 2
models:
- name: stg_team_a_positions
  description: Team A Equity Positions
  config:
    group: lob_team_a
    access: protected
    contract:
      enforced: true
    meta:
      uses:
        name: cdo.position
        version: 1
      include:
        attributes:
        - name: position_id
          entity:
            name: team_a_position
            type: primary
        - name: report_date
          dimension:
            type: time
          granularity: day
        - name: profit_loss
        - name: instrument_code
          entity:
            name: instrument
            type: foreign
        metrics:
        - name: total_profit_loss
          alias: equity_profit_loss
          label: Equity Profit and Loss
      semantic_contract:
        implements: cdo.position
        version: 1
        included_attributes:
        - position_id
        - report_date
        - profit_loss
        - instrument_code
        included_metrics:
        - total_profit_loss
        lineage:
        - name: cdo.all
          version: 1
  semantic_model:
    enabled: true
    name: team_a_equity_positions
  agg_time_dimension: report_date
  columns:
  - name: position_id
    data_type: text
    description: Position identifier
    entity:
      name: team_a_position
      type: primary
  - name: report_date
    data_type: date
    description: Business reporting date
    dimension:
      type: time
    granularity: day
  - name: profit_loss
    data_type: numeric
    description: Standardized profit and loss
  - name: instrument_code
    data_type: integer
    description: Financial instrument identifier
    entity:
      name: instrument
      type: foreign
  - name: mtm
    data_type: numeric
  - name: cash
    data_type: numeric
  metrics:
  - type: simple
    agg: sum
    expr: profit_loss
    fill_nulls_with: 0
    name: equity_profit_loss
    label: Equity Profit and Loss
    description: Total position profit and loss
    config:
      meta:
        metric_contract:
          implements: total_profit_loss
          version: 1
  - name: team_a_position_count
    label: Team A Position Count
    description: Number of Team A Equity Positions.
    type: simple
    agg: count
    expr: position_id
  - name: equity_total_mtm
    label: Equity Total Mark to Market
    description: POC total MTM of Team A positions at the requested reporting grain.
    type: simple
    agg: sum
    expr: mtm
  - name: equity_total_cash
    label: Equity Total Cash
    description: POC total Cash of Team A positions at the requested reporting grain.
    type: simple
    agg: sum
    expr: cash
