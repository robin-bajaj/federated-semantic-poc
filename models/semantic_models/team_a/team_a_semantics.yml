version: 2
models:
- name: stg_team_a_positions
  description: Team A Equity Position semantic model.
  config:
    group: lob_team_a
    access: protected
    contract:
      enforced: true
    meta:
      semantic_inheritance:
        extends: cdo.position
        version: 1
        entity_aliases:
          position: team_a_position
        metric_aliases:
          cdo.profit_loss: equity_profit_loss
        metric_labels:
          cdo.profit_loss: Equity Profit and Loss
      semantic_contract:
        implements: cdo.position
        version: 1
  semantic_model:
    enabled: true
    name: team_a_equity_positions
  columns:
  - name: position_id
    data_type: text
    description: Enterprise position identifier
    entity:
      name: team_a_position
      type: primary
  - name: report_date
    data_type: date
    granularity: day
    dimension:
      type: time
  - name: profit_loss
    data_type: numeric
    description: Standardized position profit and loss
  - name: instrument_code
    data_type: integer
    entity:
      name: instrument
      type: foreign
  - name: mtm
    data_type: numeric
  - name: cash
    data_type: numeric
  metrics:
  - type: simple
    agg: sum
    expr: profit_loss
    fill_nulls_with: 0
    name: equity_profit_loss
    label: Equity Profit and Loss
    description: 'Total position profit and loss measured as the sum of standardized position-level profit_loss
      values over the query''s dimensions and date.

      '
    config:
      meta:
        metric_contract:
          implements: cdo.profit_loss
          version: 1
  - name: team_a_position_count
    label: Team A Position Count
    description: Number of Team A Equity Positions.
    type: simple
    agg: count
    expr: position_id
  - name: equity_total_mtm
    label: Equity Total Mark to Market
    description: POC total MTM of Team A positions at the requested reporting grain.
    type: simple
    agg: sum
    expr: mtm
  - name: equity_total_cash
    label: Equity Total Cash
    description: POC total Cash of Team A positions at the requested reporting grain.
    type: simple
    agg: sum
    expr: cash
  agg_time_dimension: report_date
