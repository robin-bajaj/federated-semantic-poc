# Team A's AUTHORED semantic definition; kept short on main.
# CDO owns common Position names, data types, descriptions, and P&L formula.
# This custom config.meta declaration must be compiled before dbt parse/build;
# the compiler expands it into native dbt columns and metrics in a temporary checkout.
version: 2

models:
  - name: stg_team_a_positions
    description: Team A Equity Positions

    config:
      # This team owns its implementation. 'protected' allows cross-group references.
      group: lob_team_a
      access: protected
      # Native dbt contracts verify physical column names/types during dbt build.
      contract:
        enforced: true

      meta:
        # Reuse the versioned CDO business definition; do not duplicate its types.
        uses:
          name: cdo.position
          version: 1

        include:
          # Opt in to CDO fields. Teams choose entity/dimension semantics;
          # CDO supplies each selected field's name, type and description.
          attributes:
            - name: position_id
              # Custom CDO alias: expose this primary entity as equity_position_id.
              # The physical/contract column remains position_id.
              alias: equity_position_id
              entity:
                type: primary

            - name: report_date
              dimension:
                type: time
              granularity: day

            - name: profit_loss

            - name: instrument_code
              entity:
                name: instrument
                type: foreign

          # Adopt CDO SUM(profit_loss) without changing its formula.
          # The alias is the team-facing metric name after compilation.
          metrics:
            - name: total_profit_loss
              alias: equity_profit_loss
              label: Equity Profit and Loss

    # Native dbt Semantic Layer model name exposed to metric consumers.
    semantic_model:
      enabled: true
      name: team_a_equity_positions

    agg_time_dimension: report_date

    # Team-owned columns only. Do not redeclare inherited CDO columns here.
    columns:
      - name: mtm
        data_type: numeric

      - name: cash
        data_type: numeric

    # Team-owned metrics only. The inherited P&L metric is generated by the compiler.
    metrics:
      - name: team_a_position_count
        label: Team A Position Count
        description: Number of Team A Equity Positions.
        type: simple
        agg: count
        expr: position_id

      # POC assumption: SUM of mark-to-market values at the chosen reporting grain.
      - name: equity_total_mtm
        label: Equity Total Mark to Market
        description: POC total MTM of Team A positions at the requested reporting grain.
        type: simple
        agg: sum
        expr: mtm

      # Financial owners should confirm aggregation, currency and date semantics.
      - name: equity_total_cash
        label: Equity Total Cash
        description: POC total Cash of Team A positions at the requested reporting grain.
        type: simple
        agg: sum
        expr: cash
