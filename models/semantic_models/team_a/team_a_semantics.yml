# Team A owns only the physical model, team-specific fields and metric aliases.
# CDO Position fields, semantic dimensions, entities and P&L formula are
# inherited by the custom compiler before dbt parse.
version: 2
models:
  - name: stg_team_a_positions
    description: Team A Equity Position semantic model.
    config:
      group: lob_team_a
      access: protected
      meta:
        semantic_inheritance:
          extends: cdo.position
          version: 1
          entity_aliases:
            position: team_a_position
          metric_aliases:
            cdo.profit_loss: equity_profit_loss
          metric_labels:
            cdo.profit_loss: Equity Profit and Loss
    semantic_model:
      enabled: true
      name: team_a_equity_positions
    columns:
      - name: mtm
        data_type: numeric
      - name: cash
        data_type: numeric
    metrics:
      - name: team_a_position_count
        label: Team A Position Count
        description: Number of Team A Equity Positions.
        type: simple
        agg: count
        expr: position_id
