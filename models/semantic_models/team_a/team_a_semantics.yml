# Team A opts into the CDO-owned Position v1 business definition.
# meta.cdo is custom pre-parse inheritance metadata, not native dbt syntax.
version: 2

models:
  - name: stg_team_a_positions
    description: Team A Equity Positions

    config:
      group: lob_team_a
      access: protected
      contract:
        enforced: true

      meta:
        cdo:
          uses: cdo.position
          version: 1

          include:
            attributes:
              - name: position_id
                entity:
                  name: team_a_position
                  type: primary

              - name: report_date
                dimension:
                  type: time
                granularity: day

              - name: profit_loss

              - name: instrument_code
                entity:
                  name: instrument
                  type: foreign

            metrics:
              - name: total_profit_loss
                alias: equity_profit_loss
                label: Equity Profit and Loss

    semantic_model:
      enabled: true
      name: team_a_equity_positions

    agg_time_dimension: report_date

    # Team A-owned columns only. CDO fields are inserted by the compiler.
    columns:
      - name: mtm
        data_type: numeric

      - name: cash
        data_type: numeric

    # Team A-owned metrics only. CDO P&L formula is inherited unchanged.
    metrics:
      - name: team_a_position_count
        label: Team A Position Count
        description: Number of Team A Equity Positions.
        type: simple
        agg: count
        expr: position_id

      - name: equity_total_mtm
        label: Equity Total Mark to Market
        description: POC total MTM of Team A positions at the requested reporting grain.
        type: simple
        agg: sum
        expr: mtm

      - name: equity_total_cash
        label: Equity Total Cash
        description: POC total Cash of Team A positions at the requested reporting grain.
        type: simple
        agg: sum
        expr: cash
