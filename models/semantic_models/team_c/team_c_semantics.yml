# Team C's AUTHORED semantic definition; kept short on main.
# CDO owns common Position names, data types, descriptions, and P&L formula.
# This custom config.meta declaration must be compiled before dbt parse/build;
# the compiler expands it into native dbt columns and metrics in a temporary checkout.
version: 2

models:
  - name: stg_team_c_positions
    description: Team C Fixed Income Positions

    config:
      # This team owns its implementation. 'protected' allows cross-group references.
      group: lob_team_c
      access: protected
      # Native dbt contracts verify physical column names/types during dbt build.
      contract:
        enforced: true

      meta:
        # Reuse the versioned CDO business definition; do not duplicate its types.
        uses:
          name: cdo.position
          version: 1

        include:
          # Opt in to CDO fields. Teams choose entity/dimension semantics;
          # CDO supplies each selected field's name, type and description.
          attributes:
            - name: position_id
              entity:
                name: team_c_position
                type: primary

            - name: report_date
              dimension:
                type: time
              granularity: day

            - name: profit_loss

            - name: instrument_code
              entity:
                name: instrument
                type: foreign

          # Adopt CDO SUM(profit_loss) without changing its formula.
          # The alias is the team-facing metric name after compilation.
          metrics:
            - name: total_profit_loss
              alias: fixed_income_profit_loss
              label: Fixed Income Profit and Loss

    # Native dbt Semantic Layer model name exposed to metric consumers.
    semantic_model:
      enabled: true
      name: team_c_fi_positions

    agg_time_dimension: report_date

    # Team-owned columns only. Do not redeclare inherited CDO columns here.
    columns:
      - name: settled_cash
        data_type: numeric

    # Team-owned metrics only. The inherited P&L metric is generated by the compiler.
    metrics:
      - name: team_c_position_count
        label: Team C Position Count
        description: Number of Team C Fixed Income Positions.
        type: simple
        agg: count
        expr: position_id

      # POC assumption: SUM of settled cash; confirm currency/date/grain semantics.
      - name: fi_total_settled_cash
        label: Fixed Income Total Settled Cash
        description: POC total settled cash of Team C positions at the requested reporting grain.
        type: simple
        agg: sum
        expr: settled_cash
