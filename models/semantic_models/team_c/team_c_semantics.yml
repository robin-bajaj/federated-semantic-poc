# Team C inherits the enterprise Position semantic definition from CDO.
version: 2
models:
  - name: stg_team_c_positions
    description: Team C Fixed Income Position semantic model.
    config:
      group: lob_team_c
      access: protected
      # Native dbt contract: applies only to this opted-in model.
      # Inherited CDO columns are expanded before dbt parses/builds.
      contract:
        enforced: true
      meta:
        semantic_inheritance:
          extends: cdo.position
          version: 1
          entity_aliases:
            position: team_c_position
          metric_aliases:
            cdo.profit_loss: fixed_income_profit_loss
          metric_labels:
            cdo.profit_loss: Fixed Income Profit and Loss
    semantic_model:
      enabled: true
      name: team_c_fi_positions
    columns:
      - name: settled_cash
        data_type: numeric
    metrics:
      - name: team_c_position_count
        label: Team C Position Count
        description: Number of Team C Fixed Income Positions.
        type: simple
        agg: count
        expr: position_id

      # Team C explicitly owns this aggregation. SUM is provisional for
      # POC use, pending financial sign-off on currency/date/grain semantics.
      - name: fi_total_settled_cash
        label: Fixed Income Total Settled Cash
        description: POC total settled cash of Team C positions at the requested reporting grain.
        type: simple
        agg: sum
        expr: settled_cash
