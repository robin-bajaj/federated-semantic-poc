version: 2
models:
- name: stg_team_c_positions
  description: Team C Fixed Income Position semantic model.
  config:
    group: lob_team_c
    access: protected
    contract:
      enforced: true
    meta:
      semantic_inheritance:
        extends: cdo.position
        version: 1
        entity_aliases:
          position: team_c_position
        metric_aliases:
          cdo.profit_loss: fixed_income_profit_loss
        metric_labels:
          cdo.profit_loss: Fixed Income Profit and Loss
      semantic_contract:
        implements: cdo.position
        version: 1
  semantic_model:
    enabled: true
    name: team_c_fi_positions
  columns:
  - name: position_id
    data_type: text
    description: Enterprise position identifier
    entity:
      name: team_c_position
      type: primary
  - name: report_date
    data_type: date
    granularity: day
    dimension:
      type: time
  - name: profit_loss
    data_type: numeric
    description: Standardized position profit and loss
  - name: instrument_code
    data_type: integer
    entity:
      name: instrument
      type: foreign
  - name: settled_cash
    data_type: numeric
  metrics:
  - type: simple
    agg: sum
    expr: profit_loss
    fill_nulls_with: 0
    name: fixed_income_profit_loss
    label: Fixed Income Profit and Loss
    description: 'Total position profit and loss measured as the sum of standardized position-level profit_loss
      values over the query''s dimensions and date.

      '
    config:
      meta:
        metric_contract:
          implements: cdo.profit_loss
          version: 1
  - name: team_c_position_count
    label: Team C Position Count
    description: Number of Team C Fixed Income Positions.
    type: simple
    agg: count
    expr: position_id
  - name: fi_total_settled_cash
    label: Fixed Income Total Settled Cash
    description: POC total settled cash of Team C positions at the requested reporting grain.
    type: simple
    agg: sum
    expr: settled_cash
  agg_time_dimension: report_date
