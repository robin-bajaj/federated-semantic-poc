version: 2
models:
- name: stg_team_c_positions
  description: Team C Fixed Income Positions
  config:
    group: lob_team_c
    access: protected
    contract:
      enforced: true
    meta:
      uses:
        name: cdo.position
        version: 1
      include:
        attributes:
        - name: position_id
          entity:
            name: team_c_position
            type: primary
        - name: report_date
          dimension:
            type: time
          granularity: day
        - name: profit_loss
        - name: instrument_code
          entity:
            name: instrument
            type: foreign
        metrics:
        - name: total_profit_loss
          alias: fixed_income_profit_loss
          label: Fixed Income Profit and Loss
      semantic_contract:
        implements: cdo.position
        version: 1
        included_attributes:
        - position_id
        - report_date
        - profit_loss
        - instrument_code
        included_metrics:
        - total_profit_loss
        lineage:
        - name: cdo.all
          version: 1
  semantic_model:
    enabled: true
    name: team_c_fi_positions
  agg_time_dimension: report_date
  columns:
  - name: position_id
    data_type: text
    description: Position identifier
    entity:
      name: team_c_position
      type: primary
  - name: report_date
    data_type: date
    description: Business reporting date
    dimension:
      type: time
    granularity: day
  - name: profit_loss
    data_type: numeric
    description: Standardized profit and loss
  - name: instrument_code
    data_type: integer
    description: Financial instrument identifier
    entity:
      name: instrument
      type: foreign
  - name: settled_cash
    data_type: numeric
  metrics:
  - type: simple
    agg: sum
    expr: profit_loss
    fill_nulls_with: 0
    name: fixed_income_profit_loss
    label: Fixed Income Profit and Loss
    description: Total position profit and loss
    config:
      meta:
        metric_contract:
          implements: total_profit_loss
          version: 1
  - name: team_c_position_count
    label: Team C Position Count
    description: Number of Team C Fixed Income Positions.
    type: simple
    agg: count
    expr: position_id
  - name: fi_total_settled_cash
    label: Fixed Income Total Settled Cash
    description: POC total settled cash of Team C positions at the requested reporting grain.
    type: simple
    agg: sum
    expr: settled_cash
