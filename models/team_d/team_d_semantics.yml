
version: 2

models:
  - name: team_d_reporting_cost
    description: "Team D reporting cost model."

    semantic_model:
      enabled: true
      name: team_d_reporting_cost

    agg_time_dimension: report_date

    columns:
      - name: report_date
        granularity: day
        dimension:
          type: time

    primary_entity: team_d_reporting_cost

    metrics:
      - name: team_d_total_reporting_cost
        label: Team D Total Reporting Cost
        description: "Total reporting costs owned by Team D."
        type: simple
        agg: sum
        expr: reporting_cost

metrics:
  - name: team_d_net_profit
    label: Team D Net Profit
    description: >
      Net profit calculated using the CDO-governed
      enterprise profit metric and Team D reporting costs.
    type: derived
    expr: coalesce(enterprise_profit, 0) - coalesce(reporting_cost, 0)
    input_metrics:
      - name: enterprise_total_profit
        alias: enterprise_profit
      - name: team_d_total_reporting_cost
        alias: reporting_cost
