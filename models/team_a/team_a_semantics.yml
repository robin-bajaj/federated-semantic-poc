version: 2 # dbt properties-file format

models: # Defines metadata for dbt models
  - name: stg_team_a_positions # Associates this YAML with existing SQL model
    description: "Team A Equity Position semantic model."

    semantic_model:
      enabled: true # Enables the model for the dbt Semantic Layer
      name: team_a_equity_positions # Gives the semantic model its business-oriented name

    agg_time_dimension: report_date # This tells MetricFlow that report_date is a time dimension and the default aggregation time dimension.

    columns:
      - name: position_id # Column in the staging model
        entity: # Identifies a business object and helps establish relationships between semantic models.
          name: team_a_position # Semantic entity name
          type: primary

      - name: report_date # Column in the staging model
        granularity: day
        dimension: # Describes a business object and is used to filter or group data.
          type: time

      - name: instrument_code # Column in the staging model
        entity:
          name: instrument 
          type: foreign

    metrics:
      - name: equity_profit_loss # Technical metric identifier
        label: Equity Profit and Loss # Business-friendly name
        description: >
          Net profit or loss across Team A equity positions.
          Positive value represents profit and negative values represen loss.
        type: simple # Aggregation-based metric
        agg: sum # Add values together
        expr: profit_loss # Use the staging column profit_loss
        fill_nulls_with: 0 # Replace null metric results with zero

      - name: team_a_position_count # Technical metric identifier
        label: Team A Position Count # Business-friendly name
        description: "Number of Team A Equity Positions."
        type: simple # Aggregation-based metric
        agg: count # Add values together
        expr: position_id # Use the staging column position_id