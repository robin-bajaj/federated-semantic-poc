
# It allows Team D and other consumers to request enterprise_total_profit without redefining the calculation or manually writing SQL joins.

version: 2

metrics:
  - name: enterprise_total_profit
    label: Enterprise Total Profit
    description: >
      CDO-governed enterprise profit metric combining
      Team A Equity Position profit and
      Team C Fixed Income Position profit.
    type: derived
    expr: coalesce(equity_profit, 0) + coalesce(fi_profit, 0)
    input_metrics:
      - name: team_a_profit
        alias: equity_profit
      - name: team_c_profit
        alias: fi_profit
